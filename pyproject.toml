[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttns-chebyshev-spectra"
version = "0.1.0"
description = "Binary TTNS tangent Chebyshev, Burg maximum entropy and optimized coCheb"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "h5py", "opt_einsum", "sympy", "matplotlib"]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x"]
notebook = ["jupyterlab", "ipykernel", "nbformat", "nbclient"]
dev = ["pytest", "build"]

[tool.setuptools]
py-modules = ["print_tree"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ttns_spectra = ["data/**/*"]
renormalizer = ["LICENSE", "**/*.npz", "**/*.npy", "**/*.json", "**/*.yaml", "**/*.txt", "**/LICENSE"]
